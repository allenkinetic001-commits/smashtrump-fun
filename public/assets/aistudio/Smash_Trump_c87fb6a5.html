function khamenei(){
  const cx=250,cy=150;
  ctx.fillStyle='rgba(255,255,255,.95)';
  [[205,158,36,20],[250,138,46,28],[292,156,38,22]].forEach(c=>{ctx.beginPath();ctx.ellipse(c[0],c[1],c[2],c[3],0,0,7);ctx.fill()});
  // hide in the cloud whenever the bombers are on screen, pop back up after they leave
  let t=duckOn;t=t*t*(3-2*t);
  if(khImg.complete&&khImg.naturalWidth){
    ctx.save();ctx.beginPath();ctx.rect(cx-150,0,300,cy+22);ctx.clip();
    ctx.translate(cx,cy+28+t*150);ctx.rotate(Math.sin(frame*.1)*.06*(1-t));
    ctx.drawImage(khImg,-91/2,-140,91,140);ctx.restore();
  }
  // front cloud puffs
  ctx.fillStyle='rgba(255,255,255,.98)';
  [[222,168,34,18],[262,172,40,18],[296,166,30,16]].forEach(c=>{ctx.beginPath();ctx.ellipse(c[0],c[1],c[2],c[3],0,0,7);ctx.fill()});
}
function skyline(){layer(900,.12,monument);layer(640,.4,whiteHouse)}
function txt(s,x,y,size,color='#fff'){
  ctx.font='800 '+size+'px system-ui,sans-serif';ctx.textAlign='center';
  ctx.lineJoin='round';ctx.lineWidth=size/5;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(s,x,y);
  ctx.fillStyle=color;ctx.fillText(s,x,y);
}
let pickShown=null;
function draw(){
  if(pickEl)pickEl.style.display='none';
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const sky=ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#3f9fe0');sky.addColorStop(.7,'#bfe3f5');sky.addColorStop(1,'#fbe3b8');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.8)';
  clouds.forEach(c=>{ctx.beginPath();ctx.ellipse(c.x,c.y,38*c.s+12,14*c.s+8,0,0,7);ctx.ellipse(c.x+24*c.s,c.y-8,26*c.s+8,14*c.s+6,0,0,7);ctx.fill()});
  cloudLayer();
  bombers();
  skyline();
  pipes.forEach(pipe);
  // ground
  ctx.fillStyle='#3a3d42';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#4caf50';ctx.fillRect(0,GROUND,W,14);
  ctx.fillStyle='#e8e8e8';
  const off=(st==='play'?frame*SPEED:0)%24;
  for(let x=-off;x<W;x+=24)ctx.fillRect(x,GROUND+42,12,4);
  buses();
  // player
  ctx.save();ctx.translate(110,y);ctx.rotate(rot);
  if(img.complete&&img.naturalWidth){ctx.scale(-1,1);ctx.drawImage(img,-SW/2,-SH/2,SW,SH)}
  else{ctx.fillStyle='#fff';ctx.fillRect(-SW/2,-SH/2,SW,SH)}
  ctx.restore();
  // HUD
  if(st==='play')txt(score,W/2,80,56);
  if(st==='ready'){
    txt('SMASH TRUMP',W/2,170,40,'#ffd35c');
    txt('Tap / Space to flap',W/2,330,22);
    txt('Best: '+best,W/2,365,20);
  }
  if(st==='over'){
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(40,190,320,200);
    txt('I HUMILIATED HIM',W/2,250,27,'#ff6b6b');
    txt('Score: '+score,W/2,305,28);
    txt('Best: '+best,W/2,340,22,'#ffd35c');
    if(over>20)txt('Tap to retry',W/2,375,18);
  }
  ctx.restore();
}
reset();
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
