<title>Smash Trump</title>
<style>
:root{--bg:#0a1f44;--ink:#fff;--accent:#d7263d;--gold:#f2c14e;color-scheme:dark}
html,body{height:100%;height:100dvh;width:100%;margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{width:100%;height:100%;height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#0a1f44}
#game-box{position:relative;height:100%;max-height:100dvh;width:100%;max-width:min(100vw,calc(100dvh * 2 / 3));aspect-ratio:2/3;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;max-height:100dvh;background:#7fd1ae;border-radius:0;box-shadow:0 8px 30px rgba(0,0,0,.45);display:block;touch-action:none}
@media (min-width:500px){canvas{border-radius:12px}#game-box{border-radius:12px}}

#burger-btn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:8px;background:rgba(10,31,68,.88);border:1.5px solid rgba(255,211,92,.5);box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:6px;z-index:50;transition:all .18s ease;outline:none;pointer-events:auto;-webkit-tap-highlight-color:transparent}
#burger-btn:hover{background:rgba(10,31,68,.98);border-color:#ffd35c;transform:scale(1.06)}
#burger-btn:active{transform:scale(.95)}
#burger-btn span{display:block;width:20px;height:2.5px;background:#ffd35c;border-radius:2px}

#pick{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(10,31,68,.94);padding:8px 12px;border-radius:10px;border:1.5px solid rgba(255,211,92,.55);box-shadow:0 8px 30px rgba(0,0,0,.7);z-index:30;pointer-events:auto;max-width:calc(100% - 24px)}
#pick .char-card{width:72px;height:78px;border-radius:8px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px;transition:all .15s ease;outline:none;user-select:none;-webkit-tap-highlight-color:transparent}
#pick .char-card:hover{border-color:#ffd35c;background:rgba(255,211,92,.18);transform:translateY(-2px)}
#pick .char-card:active{transform:scale(.94)}
#pick .char-card.on{border:2px solid #ffd35c;background:rgba(255,211,92,.28);box-shadow:0 0 14px rgba(255,211,92,.7);transform:translateY(-2px)}
#pick .char-card img{width:46px;height:46px;object-fit:contain;pointer-events:none;image-rendering:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
#pick .char-card .char-name{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-top:4px;color:#cce0ff;pointer-events:none;white-space:nowrap}
#pick .char-card.on .char-name{color:#ffd35c;text-shadow:0 0 8px rgba(255,211,92,.6)}

#burger-menu{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;pointer-events:auto;touch-action:none}
#burger-menu.hidden{display:none !important}
.menu-backdrop{position:absolute;inset:0;background:rgba(4,12,28,.84);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.menu-card{position:relative;z-index:2;width:100%;max-width:330px;background:#0a1f44;border:1.5px solid rgba(255,211,92,.65);border-radius:14px;padding:18px;box-shadow:0 16px 40px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:12px;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;animation:popIn .18s ease-out}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.menu-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:10px}
.token-title{font-size:18px;font-weight:800;color:#ffd35c;letter-spacing:.5px}
#close-menu-btn{width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s ease;-webkit-tap-highlight-color:transparent}
#close-menu-btn:hover{background:rgba(255,255,255,.2);border-color:#ffd35c}
.menu-body{display:flex;flex-direction:column;gap:10px}
.ca-header{display:flex;align-items:center;justify-content:space-between}
.ca-tag{font-size:10px;font-weight:700;text-transform:uppercase;color:#9cb3d9;letter-spacing:.6px}
.ca-container{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);border-radius:7px;padding:8px 10px;word-break:break-all;user-select:all;-webkit-user-select:all}
.ca-container code{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;line-height:1.4;color:#ffd35c}
#copy-ca-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:7px;background:#ffd35c;color:#07152d;font-size:12px;font-weight:700;border:none;cursor:pointer;transition:all .15s ease;-webkit-tap-highlight-color:transparent}
#copy-ca-btn:hover{background:#ffe082;transform:translateY(-1px)}
#copy-ca-btn:active{transform:translateY(0)}
.menu-actions{display:flex;gap:8px;margin-top:2px}
.link-btn{flex:1;text-align:center;padding:9px 4px;border-radius:7px;font-size:11px;font-weight:600;text-decoration:none;transition:all .15s ease;display:inline-block;-webkit-tap-highlight-color:transparent}
.pump-btn{background:rgba(0,209,143,.18);color:#00d18f;border:1px solid rgba(0,209,143,.4)}
.pump-btn:hover{background:rgba(0,209,143,.3);border-color:#00d18f}
.dex-btn{background:rgba(59,130,246,.18);color:#60a5fa;border:1px solid rgba(59,130,246,.4)}
.dex-btn:hover{background:rgba(59,130,246,.3);border-color:#60a5fa}
</style>

function sndFlap(){

function khamenei(){
  const cx=250,cy=150;
  ctx.fillStyle='rgba(255,255,255,.95)';
  [[205,158,36,20],[250,138,46,28],[292,156,38,22]].forEach(c=>{ctx.beginPath();ctx.ellipse(c[0],c[1],c[2],c[3],0,0,7);ctx.fill()});
  // hide in the cloud whenever the bombers are on screen, pop back up after they leave
  let t=duckOn;t=t*t*(3-2*t);
  if(khImg.complete&&khImg.naturalWidth){
    ctx.save();ctx.beginPath();ctx.rect(cx-150,0,300,cy+22);ctx.clip();
    ctx.translate(cx,cy+28+t*150);ctx.rotate(Math.sin(frame*.1)*.06*(1-t));
    ctx.drawImage(khImg,-91/2,-140,91,140);ctx.restore();
  }
  // front cloud puffs
  ctx.fillStyle='rgba(255,255,255,.98)';
  [[222,168,34,18],[262,172,40,18],[296,166,30,16]].forEach(c=>{ctx.beginPath();ctx.ellipse(c[0],c[1],c[2],c[3],0,0,7);ctx.fill()});
}
function skyline(){layer(900,.12,monument);layer(640,.4,whiteHouse)}
function txt(s,x,y,size,color='#fff'){
  ctx.font='800 '+size+'px system-ui,sans-serif';ctx.textAlign='center';
  ctx.lineJoin='round';ctx.lineWidth=size/5;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(s,x,y);
  ctx.fillStyle=color;ctx.fillText(s,x,y);
}
let pickShown=null;
function draw(){
  if(pickEl)pickEl.style.display=(st==='ready'?'flex':'none');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const sky=ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#3f9fe0');sky.addColorStop(.7,'#bfe3f5');sky.addColorStop(1,'#fbe3b8');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.8)';
  clouds.forEach(c=>{ctx.beginPath();ctx.ellipse(c.x,c.y,38*c.s+12,14*c.s+8,0,0,7);ctx.ellipse(c.x+24*c.s,c.y-8,26*c.s+8,14*c.s+6,0,0,7);ctx.fill()});
  cloudLayer();
  bombers();
  skyline();
  pipes.forEach(pipe);
  // ground
  ctx.fillStyle='#3a3d42';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#4caf50';ctx.fillRect(0,GROUND,W,14);
  ctx.fillStyle='#e8e8e8';
  const off=(st==='play'?frame*SPEED:0)%24;
  for(let x=-off;x<W;x+=24)ctx.fillRect(x,GROUND+42,12,4);
  buses();
  // player
  ctx.save();ctx.translate(110,y);ctx.rotate(rot);
  if(img.complete&&img.naturalWidth){if(sprites[cur]&&sprites[cur].flip!==false){ctx.scale(-1,1);}ctx.drawImage(img,-SW/2,-SH/2,SW,SH)}
  else{}
  ctx.restore();
  // HUD
  if(st==='play')txt(score,W/2,80,56);
  if(st==='ready'){
    txt('SMASH TRUMP',W/2,170,40,'#ffd35c');
    txt('Tap / Space to flap',W/2,330,22);
    txt('Best: '+best,W/2,365,20);
  }
  if(st==='over'){
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(40,190,320,200);
    txt('I HUMILIATED HIM',W/2,250,27,'#ff6b6b');
    txt('Score: '+score,W/2,305,28);
    txt('Best: '+best,W/2,340,22,'#ffd35c');
    if(over>20)txt('Tap to retry',W/2,375,18);
  }
  ctx.restore();
}
reset();
(function loop(){update();draw();requestAnimationFrame(loop)})();

window.pickCharacter=pick;
window.getCharacters=()=>sprites.map((s,i)=>({id:i,name:s.name||('Character '+(i+1)),src:s.src}));
window.getCurrentCharacter=()=>cur;
window.toggleMute=()=>{muted=!muted;return muted;};
window.isMuted=()=>muted;
window.flapGame=flap;

// Burger menu interaction
(function(){
  const burgerBtn=document.getElementById('burger-btn');
  const burgerMenu=document.getElementById('burger-menu');
  const closeMenuBtn=document.getElementById('close-menu-btn');
  const copyCaBtn=document.getElementById('copy-ca-btn');
  const copyBtnText=document.getElementById('copy-btn-text');
  const caAddress='7wAvQc44PD3xNMPkAH5Woj5LQyYy8cLKh9RmabEYpump';

  function toggleBurger(e){
    if(e){e.stopPropagation();e.preventDefault();}
    if(!burgerMenu)return;
    const isHidden=burgerMenu.classList.contains('hidden');
    if(isHidden){
      burgerMenu.classList.remove('hidden');
    }else{
      burgerMenu.classList.add('hidden');
      window.focus();
    }
  }

  if(burgerBtn){
    burgerBtn.addEventListener('click',toggleBurger);
    burgerBtn.addEventListener('pointerdown',e=>e.stopPropagation());
  }
  if(closeMenuBtn){
    closeMenuBtn.addEventListener('click',toggleBurger);
    closeMenuBtn.addEventListener('pointerdown',e=>e.stopPropagation());
  }
  if(burgerMenu){
    burgerMenu.addEventListener('pointerdown',e=>e.stopPropagation());
    burgerMenu.addEventListener('click',e=>{
      e.stopPropagation();
      if(e.target===burgerMenu||e.target.classList.contains('menu-backdrop')){
        burgerMenu.classList.add('hidden');
        window.focus();
      }
    });
  }
  if(copyCaBtn){
    const doFeedback=()=>{
      if(copyBtnText)copyBtnText.textContent='Copied! ✓';
      setTimeout(()=>{if(copyBtnText)copyBtnText.textContent='Copy Address';},2000);
    };
    copyCaBtn.addEventListener('click',e=>{
      e.stopPropagation();
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(caAddress).then(doFeedback).catch(()=>{
          fallbackCopy(caAddress);
          doFeedback();
        });
      }else{
        fallbackCopy(caAddress);
        doFeedback();
      }
    });
    copyCaBtn.addEventListener('pointerdown',e=>e.stopPropagation());
  }

  function fallbackCopy(text){
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';
    ta.style.left='-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{document.execCommand('copy');}catch(err){}
    document.body.removeChild(ta);
  }
})();
</script>
